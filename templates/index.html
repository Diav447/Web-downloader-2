<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTLite - Fix Audio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col items-center px-4 py-10">
  <div class="w-full max-w-2xl">
    <h1 class="text-4xl font-bold">YT<span class="text-violet-500">Lite.</span></h1>
    <p class="text-zinc-400 mt-2">Semua kualitas ada suara 🔊 no tipu-tipu</p>
    <div class="mt-8 bg-zinc-900/60 border border-zinc-800 rounded-[20px] p-4 flex gap-2">
      <input id="urlInput" placeholder="Paste link YouTube disini..." class="flex-1 bg-zinc-800 rounded-xl px-4 py-3 outline-none text-sm focus:ring-2 focus:ring-violet-500">
      <button onclick="fetchVideo()" class="bg-violet-600 hover:bg-violet-500 px-6 rounded-xl font-semibold transition">GAS</button>
    </div>
    <div id="loading" class="hidden mt-6 text-center text-zinc-400">Lagi ngeracik video + audio... ⏳</div>
    <div id="result" class="hidden mt-6 bg-zinc-900 border border-zinc-800 rounded-[24px] overflow-hidden"></div>
  </div>
<script>
async function fetchVideo(){
  const url=document.getElementById('urlInput').value
  if(!url)return alert('Link mana bro?')
  document.getElementById('loading').classList.remove('hidden')
  document.getElementById('result').classList.add('hidden')
  const res=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})})
  const data=await res.json()
  document.getElementById('loading').classList.add('hidden')
  if(data.error)return alert(data.error)
  let btns=data.formats.map(f=>`
    <a href="/download?url=${encodeURIComponent(data.original_url)}&q=${f.height}" class="flex justify-between items-center bg-zinc-800 hover:bg-violet-600 border border-zinc-700 rounded-xl px-4 py-3 transition group">
      <span class="font-semibold">${f.quality} • MP4 🔊</span>
      <span class="text-xs bg-white text-black group-hover:bg-black group-hover:text-white px-3 py-1 rounded-full transition">DOWNLOAD</span>
    </a>`).join('')
  document.getElementById('result').innerHTML=`
    <img src="${data.thumbnail}" class="w-full h-64 object-cover">
    <div class="p-5">
      <h2 class="font-bold text-lg leading-tight">${data.title}</h2>
      <p class="text-zinc-400 text-sm mt-1">${data.uploader} • ${data.duration}</p>
      <div class="mt-5 grid gap-2">${btns}</div>
      <p class="text-[11px] text-green-400 mt-3">✅ Semua format sudah include audio.</p>
    </div>`
  document.getElementById('result').classList.remove('hidden')
}
</script>
</body>
</html>
